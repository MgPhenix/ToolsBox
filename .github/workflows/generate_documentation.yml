name: Generate Documentation

on:
    workflow_call:

permissions:
  contents: write

jobs:
    default:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Generate Documentation
              shell: pwsh
              run: |
                New-Item -ItemType Directory -Force -Path "docs/html"
                ./bin/doxygen/doxygen.exe ./src/ToolsBox/Doxyfile
            
            - name: Upload Documentation
              uses: actions/upload-artifact@v4
              with:
                name: ToolsBox-Documentation
                path: docs/html/