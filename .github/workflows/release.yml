name: Create Release

on:
  workflow_dispatch:
    inputs:

      tag:
        description: "Tag of the release"
        required: true
        type: string

      title:
        description: "Title of the release"
        required: false
        default: "Default Release"
        type: string
      
      pre-release:
        description: "Is the release a Pre-Release ?"
        required: false
        default: false
        type: boolean


permissions:
  contents: write


jobs:
  build:
    uses: ./.github/workflows/build.yml
  
  create-documentation:
    uses: ./.github/workflows/generate_documentation.yml

  create_release:
    needs: 
      - build
      - create-documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ToolsBox-*
          path: dist
          merge-multiple: true
          ref: ${{ inputs.tag }}

      - name: Compress File
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/package-windows/lib"
          Copy-Item "dist/ToolsBox-Windows-x64.lib" "dist/package-windows/lib/"
          
          New-Item -ItemType Directory -Force -Path "dist/package-linux/lib"
          Copy-Item "dist/ToolsBox-Linux-x64.lib" "dist/package-linux/lib/"

          New-Item -ItemType Directory -Force -Path "dist/package-macos/lib"
          Copy-Item "dist/ToolsBox-macOS-x64.lib" "dist/package-macos/lib/"

          New-Item -ItemType Directory -Force -Path "dist/package-windows/docs"
          Copy-Item -Path "dist/ToolsBox-Documentation/docs/*" "dist/package-windows/docs/"


           Compress-Archive `
            -Path "dist/package-windows/*" `
            -DestinationPath "dist/ToolsBox-Windows-x64.zip" `
            -Force

      - name: Release On Github
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title }}
          prerelease: ${{ inputs.pre-release }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/ToolsBox-Windows-x64.lib
            dist/ToolsBox-Linux-x64.a
            dist/ToolsBox-macOS-x64.a
            dist/ToolsBox-Windows-x64.zip
