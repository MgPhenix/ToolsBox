name: Create Release

on:
  workflow_dispatch:
    inputs:

      tag:
        description: "Tag of the release"
        required: true
        type: string

      title:
        description: "Title of the release"
        required: false
        default: "Default Release"
        type: string
      
      pre-release:
        description: "Is the release a Pre-Release ?"
        required: false
        default: false
        type: boolean

      release-desc:
        description: "Description of the release"
        required: false
        default: ""
        type: string


permissions:
  contents: write


jobs:
  build:
    uses: ./.github/workflows/build.yml
  
  create-documentation:
    uses: ./.github/workflows/generate_documentation.yml

  create_release:
    needs: 
      - build
      - create-documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ToolsBox-*
          path: dist
          merge-multiple: true
          ref: ${{ inputs.tag }}

      - name: Compress File
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/package-windows/lib"
          Copy-Item "dist/ToolsBox-Windows-x64.lib" "dist/package-windows/lib/"
          New-Item -ItemType Directory -Force -Path "dist/package-windows/docs"
          Copy-Item -Path "dist/html/*" "dist/package-windows/docs/html"

          New-Item -ItemType Directory -Force -Path "dist/package-windows/examples"          
          New-Item -ItemType Directory -Force -Path "dist/package-windows/include"
               
          Copy-Item `
              -Path "./src/Examples/*" `
              -Destination "dist/package-windows/examples/" `
              -Recurse

          Get-ChildItem -Path "./src/ToolsBox" -Recurse -File |
              Where-Object { $_.Extension -in ".h", ".inl" } |
              Copy-Item -Destination {
                  Join-Path "dist/package-windows/include" $_.Name
              }

          Copy-Item "./README.md" "dist/package-windows/"




          New-Item -ItemType Directory -Force -Path "dist/package-linux/lib"
          Copy-Item "dist/ToolsBox-Linux-x64.a" "dist/package-linux/lib/"
          New-Item -ItemType Directory -Force -Path "dist/package-linux/docs"
          Copy-Item -Path "dist/html/*" "dist/package-linux/docs/html"          

          New-Item -ItemType Directory -Force -Path "dist/package-linux/examples"          
          New-Item -ItemType Directory -Force -Path "dist/package-linux/include"
               
          Copy-Item `
              -Path "./src/Examples/*" `
              -Destination "dist/package-linux/examples/" `
              -Recurse

          Get-ChildItem -Path "./src/ToolsBox" -Recurse -File |
              Where-Object { $_.Extension -in ".h", ".inl" } |
              Copy-Item -Destination {
                  Join-Path "dist/package-linux/include" $_.Name
              }

          Copy-Item "./README.md" "dist/package-linux/"




          New-Item -ItemType Directory -Force -Path "dist/package-macos/lib"
          Copy-Item "dist/ToolsBox-macOS-x64.a" "dist/package-macos/lib/"
          New-Item -ItemType Directory -Force -Path "dist/package-macos/docs"
          Copy-Item -Path "dist/html/*" "dist/package-macos/docs/html"        

          New-Item -ItemType Directory -Force -Path "dist/package-macos/examples"          
          New-Item -ItemType Directory -Force -Path "dist/package-macos/include"
               
          Copy-Item `
              -Path "./src/Examples/*" `
              -Destination "dist/package-macos/examples/" `
              -Recurse

          Get-ChildItem -Path "./src/ToolsBox" -Recurse -File |
              Where-Object { $_.Extension -in ".h", ".inl" } |
              Copy-Item -Destination {
                  Join-Path "dist/package-macos/include" $_.Name
              }

          Copy-Item "./README.md" "dist/package-macos/"




          Compress-Archive `
            -Path "dist/package-windows/*" `
            -DestinationPath "dist/ToolsBox-Windows-x64.zip" `
            -Force

          Compress-Archive `
            -Path "dist/package-linux/*" `
            -DestinationPath "dist/ToolsBox-Linux-x64.zip" `
            -Force

          Compress-Archive `
            -Path "dist/package-macos/*" `
            -DestinationPath "dist/ToolsBox-macOS-x64.zip" `
            -Force


      - name: Release On Github
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title }}
          prerelease: ${{ inputs.pre-release }}
          body_path: CHANGELOG.txt
          body: ${{ inputs.release-desc }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/ToolsBox-Windows-x64.zip
            dist/ToolsBox-Linux-x64.zip
            dist/ToolsBox-macOS-x64.zip
